spring:
  application:
    name: webscout

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-lifetime: 15m

logging:
  level:
    root: INFO
    com.webscout: DEBUG